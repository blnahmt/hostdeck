# Contributor License Agreement (CLA Assistant Lite).
# A bot asks first-time contributors to sign CLA.md by commenting on their pull request.
# Signatures are stored in signatures/cla.json on the cla-signatures branch.
name: CLA

on:
  issue_comment:
    types: [created]
  # pull_request_target runs in the base repository; this workflow never checks out PR code.
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write        # commit signatures to the cla-signatures branch
  pull-requests: write   # comment on and lock pull requests
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Pinned to the v2.6.1 commit (the upstream repository is archived).
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/blnahmt/hostdeck/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'blnahmt,dependabot[bot]'
          create-file-commit-message: 'Create CLA signatures file'
          signed-commit-message: '$contributorName signed the CLA in $owner/$repo#$pullRequestNo'
          custom-notsigned-prcomment: 'Thank you for your contribution! Before it can be merged, please read the [Contributor License Agreement](https://github.com/blnahmt/hostdeck/blob/main/CLA.md) and sign it by posting the comment below. You only need to do this once.'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you!'
